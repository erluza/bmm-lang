name: ci

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [ gcc, clang ]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: CC=${{ matrix.compiler }} make
      - name: Test
        run: CC=${{ matrix.compiler }} make test
